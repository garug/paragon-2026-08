<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paragon Map</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <img
      class="bg"
      src="/background.png"
      alt=""
      width="1024"
      height="576"
      decoding="async"
      aria-hidden="true"
    />
    <main class="page">
      <div class="map" id="map">
        <img
          class="map__image"
          src="/map.png"
          alt="Mapa de níveis — clique em um quadrado para ler o texto"
          width="1024"
          height="1536"
          draggable="false"
        />
        <div class="map__hotspots" id="hotspots" aria-label="Quadrados do mapa"></div>
      </div>
    </main>

    <div
      class="overlay"
      id="overlay"
      hidden
      aria-hidden="true"
      role="presentation"
    >
      <div
        class="overlay__dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="overlay-title"
        aria-describedby="overlay-text"
      >
        <button type="button" class="overlay__close" id="overlay-close" aria-label="Fechar">
          ×
        </button>
        <h2 class="overlay__title" id="overlay-title"></h2>
        <img class="overlay__image" id="overlay-image" alt="" hidden />
        <p class="overlay__text" id="overlay-text"></p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
